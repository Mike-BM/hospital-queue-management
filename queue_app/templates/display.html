<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Waiting Area - Live Queue Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .ticket-number {
            font-size: 7.5rem;
            font-weight: 900;
            color: #fbbf24;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }
        .room-name {
            font-size: 4.5rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }
        .dept-name {
            font-size: 2.8rem;
            font-weight: 600;
            color: #94a3b8;
        }
        .recent-card {
            background-color: #1e293b;
            border-left: 6px solid #fbbf24;
            border-radius: 0.5rem;
        }
        .live-pulse {
            width: 14px;
            height: 14px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="d-flex flex-column vh-100 p-4">
    <!-- Top Header -->
    <header class="d-flex justify-content-between align-items-center pb-3 border-bottom border-secondary mb-4">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-hospital fs-1 text-primary"></i>
            <div>
                <h1 class="h3 fw-bold mb-0 text-white">CITY HOSPITAL CENTRAL CLINIC</h1>
                <div class="text-secondary small">OUTPATIENT QUEUE MANAGEMENT SYSTEM</div>
            </div>
        </div>
        <div class="d-flex align-items-center gap-4">
            <div class="d-flex align-items-center gap-2">
                <span class="live-pulse"></span>
                <span class="text-success fw-bold small text-uppercase">Live Connected</span>
            </div>
            <div id="live-clock" class="fs-4 fw-bold text-light">--:--:--</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="row flex-grow-1 align-items-center text-center g-4">
        <!-- Main Call Display Area -->
        <div class="col-lg-8">
            <div class="p-5 rounded-4 shadow-lg border border-secondary" style="background-color: #111827;">
                <div class="text-uppercase tracking-wider fw-bold text-secondary mb-2" style="font-size: 1.8rem;">
                    <i class="bi bi-broadcast text-warning me-2"></i> NOW SERVING
                </div>
                <div id="current-ticket" class="ticket-number my-3">---</div>
                <div id="current-room" class="room-name mb-2">Please Wait</div>
                <div id="current-dept" class="dept-name">Awaiting next patient call</div>
            </div>
        </div>
        
        <!-- Sidebar for previous calls -->
        <div class="col-lg-4 h-100 d-flex flex-column">
            <div class="p-4 rounded-4 shadow-lg border border-secondary flex-grow-1 d-flex flex-column" style="background-color: #111827;">
                <h3 class="text-secondary text-uppercase fw-bold mb-4 pb-2 border-bottom border-secondary text-start">
                    <i class="bi bi-clock-history me-2"></i> Recent Calls
                </h3>
                <div id="recent-calls" class="d-flex flex-column gap-3 flex-grow-1 overflow-auto text-start">
                    <div class="text-muted text-center py-4" id="empty-recent-msg">No prior calls recorded yet today.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- WebSockets and Voice Audio Announcement Logic -->
    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // WebSocket Connection
        const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const socketUrl = wsProtocol + '://' + window.location.host + '/ws/display/';
        let queueSocket = null;

        function connectWebSocket() {
            queueSocket = new WebSocket(socketUrl);

            queueSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);

                if (data.type === 'initial_state') {
                    // Populate on load
                    if (data.current) {
                        document.getElementById('current-ticket').innerText = data.current.ticket_number;
                        document.getElementById('current-room').innerText = data.current.room;
                        document.getElementById('current-dept').innerText = data.current.department;
                    }
                    if (data.recent && data.recent.length > 0) {
                        renderRecentList(data.recent);
                    }
                } else if (data.type === 'call') {
                    // Push current to recent if valid
                    const oldTicket = document.getElementById('current-ticket').innerText;
                    const oldRoom = document.getElementById('current-room').innerText;
                    const oldDept = document.getElementById('current-dept').innerText;

                    if (oldTicket !== '---' && oldTicket !== data.ticket_number) {
                        prependRecentCall({
                            ticket_number: oldTicket,
                            room: oldRoom,
                            department: oldDept
                        });
                    }

                    // Update main screen
                    document.getElementById('current-ticket').innerText = data.ticket_number;
                    document.getElementById('current-room').innerText = data.room;
                    document.getElementById('current-dept').innerText = data.department;

                    // Flash screen
                    document.body.style.backgroundColor = '#1e293b';
                    setTimeout(() => { document.body.style.backgroundColor = '#0b1120'; }, 600);

                    // Announce once clearly
                    announce(data.ticket_number, data.room);
                }
            };

            queueSocket.onclose = function(e) {
                console.warn('Queue display socket closed. Reconnecting in 3s...');
                setTimeout(connectWebSocket, 3000);
            };

            queueSocket.onerror = function(err) {
                console.error('WebSocket error:', err);
            };
        }

        connectWebSocket();

        function renderRecentList(recentItems) {
            const container = document.getElementById('recent-calls');
            container.innerHTML = '';
            recentItems.forEach(item => {
                const card = createRecentCard(item);
                container.appendChild(card);
            });
        }

        function prependRecentCall(item) {
            const container = document.getElementById('recent-calls');
            const emptyMsg = document.getElementById('empty-recent-msg');
            if (emptyMsg) emptyMsg.remove();

            const card = createRecentCard(item);
            container.insertBefore(card, container.firstChild);

            while (container.children.length > 6) {
                container.removeChild(container.lastChild);
            }
        }

        function createRecentCard(item) {
            const div = document.createElement('div');
            div.className = 'recent-card p-3 shadow-sm d-flex justify-content-between align-items-center';
            div.innerHTML = `
                <div>
                    <div class="fs-4 fw-bold text-warning">${item.ticket_number}</div>
                    <div class="small text-secondary">${item.department}</div>
                </div>
                <div class="text-end">
                    <span class="badge bg-secondary fs-6 px-3 py-2">${item.room}</span>
                </div>
            `;
            return div;
        }

        // Voice Announcement with speech synthesis
        function announce(ticket, room) {
            if ('speechSynthesis' in window) {
                // Cancel any pending speech to prevent pile-up
                window.speechSynthesis.cancel();

                // Space out letters/numbers for clear pronunciation e.g. "C 2 6 1 0 1 9"
                const friendlyTicket = ticket.split('').join(' ');
                const message = `Ticket ${friendlyTicket}. Please proceed to ${room}.`;

                const utterance = new SpeechSynthesisUtterance(message);
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
